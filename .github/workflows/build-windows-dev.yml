name: Build Windows Dev Executable

on:
  push:
    branches:
      - windows
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run syntax & contract check
        run: |
          npm run check
          npm run test:api

      - name: Build Windows Portable Dev Executable
        run: npm run electron:build:dev

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Preluded-Dev-Windows-x64
          path: dist/Preluded-Dev-Windows.exe
          if-no-files-found: error

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>404 · Pagina non trovata | Preluded</title>
    <meta name="description" content="La traccia o la pagina che stai cercando non esiste su Preluded.">
    <link rel="canonical" href="https://preluded.vercel.app/404">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/4430/4430494.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030305;
            --accent: #FA2D48;
            --text-main: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.65);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        main {
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .code {
            font-family: 'Syne', sans-serif;
            font-size: 72px;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
        }
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 26px;
            font-weight: 700;
        }
        p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            padding: 12px 28px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            border-radius: 99px;
            font-weight: 600;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <main role="main">
        <div class="code">404</div>
        <h1>Traccia non trovata</h1>
        <p>Sembra che questo brano o questa pagina non esista nel catalogo di Preluded.</p>
        <a href="/app" class="btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            Torna al Web Player
        </a>
    </main>
</body>
</html>

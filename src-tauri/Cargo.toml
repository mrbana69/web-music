[package]
name = "preluded"
version = "2.0.0"
description = "Preluded Music - High Fidelity YouTube Music & Spotify Desktop Client"
authors = ["mrbana69"]
edition = "2021"

[lib]
name = "preluded_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }

name: preluded_music
description: "Preluded Music - Simple and Minimalistic"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.40
  audio_service: ^0.18.17
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.3
  http: ^1.2.2
  provider: ^6.1.2
  intl: ^0.19.0
  marquee: ^2.2.3
  palette_generator: ^0.3.3+4
  share_plus: ^10.1.2
  youtube_explode_dart: ^3.0.0
  url_launcher: ^6.3.1
  google_sign_in: ^6.2.2
  webview_flutter: ^4.10.0
  google_fonts: ^6.2.1
  crypto: ^3.0.3
  audio_session: ^0.1.21
  just_audio_windows: ^0.2.3
  desktop_webview_window:
    path: packages/desktop_webview_window
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

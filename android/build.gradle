// Top-level build file where you can add configuration options common to all sub-projects/modules.

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

subprojects {
    def configureNamespace = { p ->
        if (p.plugins.hasPlugin("com.android.application") ||
            p.plugins.hasPlugin("com.android.library")) {
            p.android {
                if (namespace == null) {
                    namespace p.group ? p.group : "com.plugin.${p.name.replace('-', '_')}"
                }
            }
        }
    }
    if (project.state.executed) {
        configureNamespace(project)
    } else {
        project.afterEvaluate { p ->
            configureNamespace(p)
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

